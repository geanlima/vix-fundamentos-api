services:
  vox-fundamentos-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vox-fundamentos-api
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - vox-network

networks:
  vox-network:
    driver: bridge